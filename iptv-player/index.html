<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player Privado</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>📺 IPTV Player</h1>
        <button id="btn-import" title="Importar lista M3U">＋ Importar M3U</button>
      </div>

      <div id="search-wrap">
        <input id="search" type="text" placeholder="🔍 Buscar canal..." autocomplete="off" />
      </div>

      <div id="group-tabs"></div>

      <ul id="channel-list"></ul>

      <div id="sidebar-footer">
        <button id="btn-clear" title="Borrar todas las listas">🗑 Limpiar listas</button>
        <span id="channel-count"></span>
      </div>
    </aside>

    <!-- Player area -->
    <main id="player-area">
      <div id="player-wrapper">
        <video id="video-player" controls autoplay></video>
        <div id="player-overlay" class="visible">
          <div class="overlay-icon">📺</div>
          <p>Importa una lista M3U y selecciona un canal para comenzar</p>
          <label class="drop-zone" id="drop-zone">
            <span>Arrastra tu archivo .m3u aquí o haz clic para seleccionar</span>
            <input type="file" id="file-input" accept=".m3u,.m3u8" hidden />
          </label>
        </div>
      </div>

      <div id="now-playing">
        <span id="now-title">Sin reproducción</span>
        <div id="player-controls-extra">
          <button id="btn-fullscreen" title="Pantalla completa">⛶</button>
          <button id="btn-pip" title="Picture in Picture">⧉</button>
          <button id="btn-mute" title="Silenciar">🔊</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" title="Volumen" />
        </div>
      </div>
    </main>
  </div>

  <!-- Import Modal -->
  <div id="modal-import" class="modal hidden">
    <div class="modal-box">
      <h2>Importar Lista</h2>
      <div class="import-tabs">
        <button class="tab-btn active" data-tab="xtream">Xtream Codes</button>
        <button class="tab-btn" data-tab="url">URL M3U</button>
        <button class="tab-btn" data-tab="file">Archivo</button>
        <button class="tab-btn" data-tab="paste">Pegar texto</button>
      </div>

      <!-- ── Xtream Codes tab ── -->
      <div id="tab-xtream" class="tab-content active">
        <div id="xtream-saved-wrap">
          <label>Cuentas guardadas:</label>
          <div id="xtream-saved-list"><span class="muted-note">Ninguna cuenta guardada</span></div>
        </div>
        <hr class="divider" />
        <label>Servidor (URL con puerto):</label>
        <input id="xc-server" type="url" placeholder="http://miservidor.com:8080" autocomplete="off" />
        <label>Usuario:</label>
        <input id="xc-user" type="text" placeholder="usuario" autocomplete="off" />
        <label>Contraseña:</label>
        <div class="pass-wrap">
          <input id="xc-pass" type="password" placeholder="contraseña" autocomplete="new-password" />
          <button type="button" id="btn-toggle-pass" title="Mostrar/ocultar">👁</button>
        </div>
        <label>Tipo de contenido:</label>
        <div class="xc-type-group">
          <label class="radio-label"><input type="checkbox" name="xc-type" value="live" checked /> En vivo</label>
          <label class="radio-label"><input type="checkbox" name="xc-type" value="vod" /> Películas (VOD)</label>
          <label class="radio-label"><input type="checkbox" name="xc-type" value="series" /> Series</label>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="xc-save" checked />
          Guardar cuenta (credenciales en localStorage de este navegador)
        </label>
        <small>⚠ Las credenciales se guardan solo en tu navegador, nunca se envían a terceros.</small>
      </div>

      <!-- ── URL tab ── -->
      <div id="tab-url" class="tab-content">
        <label>URL de la lista M3U / M3U8:</label>
        <input id="input-url" type="url" placeholder="http://..." />
        <small>⚠ Si falla CORS usa la opción Archivo.</small>
      </div>

      <!-- ── File tab ── -->
      <div id="tab-file" class="tab-content">
        <label class="drop-zone" id="modal-drop-zone">
          <span id="modal-drop-label">Arrastra el archivo .m3u aquí o haz clic</span>
          <input type="file" id="modal-file-input" accept=".m3u,.m3u8" hidden />
        </label>
      </div>

      <!-- ── Paste tab ── -->
      <div id="tab-paste" class="tab-content">
        <label>Pega el contenido M3U aquí:</label>
        <textarea id="input-paste" rows="8" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-name=&quot;Canal&quot;,Canal&#10;http://..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="btn-modal-cancel">Cancelar</button>
        <button id="btn-modal-import" class="primary">Conectar / Importar</button>
      </div>
      <div id="import-status"></div>
    </div>
  </div>

  <script src="src/parser.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/player.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
