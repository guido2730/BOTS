<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player Privado</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>📺 IPTV Player</h1>
        <button id="btn-import" title="Importar lista M3U">＋ Importar M3U</button>
      </div>

      <div id="search-wrap">
        <input id="search" type="text" placeholder="🔍 Buscar canal..." autocomplete="off" />
      </div>

      <div id="group-tabs"></div>

      <ul id="channel-list"></ul>

      <div id="sidebar-footer">
        <button id="btn-clear" title="Borrar todas las listas">🗑 Limpiar listas</button>
        <span id="channel-count"></span>
      </div>
    </aside>

    <!-- Player area -->
    <main id="player-area">
      <div id="player-wrapper">
        <video id="video-player" controls autoplay></video>
        <div id="player-overlay" class="visible">
          <div class="overlay-icon">📺</div>
          <p>Importa una lista M3U y selecciona un canal para comenzar</p>
          <label class="drop-zone" id="drop-zone">
            <span>Arrastra tu archivo .m3u aquí o haz clic para seleccionar</span>
            <input type="file" id="file-input" accept=".m3u,.m3u8" hidden />
          </label>
        </div>
      </div>

      <div id="now-playing">
        <span id="now-title">Sin reproducción</span>
        <div id="player-controls-extra">
          <button id="btn-fullscreen" title="Pantalla completa">⛶</button>
          <button id="btn-pip" title="Picture in Picture">⧉</button>
          <button id="btn-mute" title="Silenciar">🔊</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" title="Volumen" />
        </div>
      </div>
    </main>
  </div>

  <!-- Import Modal -->
  <div id="modal-import" class="modal hidden">
    <div class="modal-box">
      <h2>Importar Lista M3U</h2>
      <div class="import-tabs">
        <button class="tab-btn active" data-tab="url">URL</button>
        <button class="tab-btn" data-tab="file">Archivo</button>
        <button class="tab-btn" data-tab="paste">Pegar texto</button>
      </div>

      <div id="tab-url" class="tab-content active">
        <label>URL de la lista M3U / M3U8:</label>
        <input id="input-url" type="url" placeholder="http://..." />
        <small>⚠ La URL debe ser accesible desde tu red. Si falla CORS usa la opción de archivo.</small>
      </div>

      <div id="tab-file" class="tab-content">
        <label class="drop-zone" id="modal-drop-zone">
          <span id="modal-drop-label">Arrastra el archivo .m3u aquí o haz clic</span>
          <input type="file" id="modal-file-input" accept=".m3u,.m3u8" hidden />
        </label>
      </div>

      <div id="tab-paste" class="tab-content">
        <label>Pega el contenido M3U aquí:</label>
        <textarea id="input-paste" rows="10" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-name=&quot;Canal&quot;,Canal&#10;http://..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="btn-modal-cancel">Cancelar</button>
        <button id="btn-modal-import" class="primary">Importar</button>
      </div>
      <div id="import-status"></div>
    </div>
  </div>

  <script src="src/parser.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/player.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
