name: Build Android TV VPN APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android-tv-vpn/**"
      - ".github/workflows/build-android-tv-vpn.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-vpn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-vpn-debug-apk
          path: android-tv-vpn/app/build/outputs/apk/debug/*.apk
